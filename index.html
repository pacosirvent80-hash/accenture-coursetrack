<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CourseTrack — Gestión de Cursos eLearning</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #F0F4F8;
      --surface:      #FFFFFF;
      --surface-2:    #F7F9FC;
      --border:       #E2E8F0;
      --border-dark:  #CBD5E1;
      --text:         #1E293B;
      --text-2:       #64748B;
      --text-3:       #94A3B8;
      --primary:      #3B82F6;
      --primary-dark: #2563EB;
      --primary-light:#EFF6FF;

      --c-entregado:     #6366F1;
      --c-en_revision:   #8B5CF6;
      --c-incidencia:    #EF4444;
      --c-en_correccion: #F97316;
      --c-aprobado:      #22C55E;
      --c-publicado:     #0D9488;
      --c-en_pausa:      #94A3B8;

      --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
      --shadow:    0 4px 12px rgba(0,0,0,.08);
      --shadow-lg: 0 8px 28px rgba(0,0,0,.14);
      --radius:    10px;
      --radius-sm: 6px;
      --radius-lg: 16px;
      --panel-w:   480px;
      --hdr-h:     60px;
    }

    html[data-theme="dark"] {
      --bg:           #0F172A;
      --surface:      #1E293B;
      --surface-2:    #253347;
      --border:       #334155;
      --border-dark:  #475569;
      --text:         #F1F5F9;
      --text-2:       #94A3B8;
      --text-3:       #64748B;
      --primary:      #60A5FA;
      --primary-dark: #93C5FD;
      --primary-light:#1E3A5F;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
      --shadow:    0 4px 12px rgba(0,0,0,.3);
      --shadow-lg: 0 8px 28px rgba(0,0,0,.5);
    }
    html[data-theme="dark"] .conn-pill.local     { background: #1E293B; color: var(--text-3); }
    html[data-theme="dark"] .conn-pill.connected { background: #14532D; color: #4ADE80; }
    html[data-theme="dark"] .conn-pill.syncing   { background: #1E3A5F; color: var(--primary); }
    html[data-theme="dark"] .conn-pill.error     { background: #450A0A; color: #FCA5A5; }
    html[data-theme="dark"] input,
    html[data-theme="dark"] select,
    html[data-theme="dark"] textarea {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border);
      color-scheme: dark;
    }
    html[data-theme="dark"] .modal-box { background: var(--surface); }
    html[data-theme="dark"] .panel     { background: var(--surface); }

    /* Toggle button */
    .theme-toggle {
      background: none; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); width: 32px; height: 32px;
      cursor: pointer; font-size: 15px; display: flex;
      align-items: center; justify-content: center;
      color: var(--text-2); transition: all .15s; flex-shrink: 0;
    }
    .theme-toggle:hover { background: var(--surface-2); border-color: var(--border-dark); }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Header ───────────────────────────────────────── */
    .hdr {
      position: fixed; top: 0; left: 0; right: 0;
      min-height: var(--hdr-h); height: auto;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; flex-wrap: nowrap;
      padding: 0 24px; gap: 16px;
      z-index: 100; box-shadow: var(--shadow-sm);
    }
    .hdr-logo {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 16px; color: var(--text);
      white-space: nowrap;
    }
    .hdr-logo .icon {
      width: 32px; height: 32px;
      background: var(--primary); border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 15px; flex-shrink: 0;
    }
    .hdr-div { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
    .hdr-sub { color: var(--text-2); font-size: 13px; white-space: nowrap; }
    .hdr-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }

    /* Connection pill */
    .conn-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 600; white-space: nowrap;
      cursor: pointer; border: none; font-family: inherit;
      transition: all .15s;
    }
    .conn-pill.local     { background: #F1F5F9; color: var(--text-3); }
    .conn-pill.connected { background: #F0FDF4; color: #16A34A; }
    .conn-pill.syncing   { background: #EFF6FF; color: var(--primary); }
    .conn-pill.error     { background: #FEF2F2; color: #DC2626; }
    .conn-pill:hover     { filter: brightness(.95); }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; animation: spin .8s linear infinite; }

    /* ── Layout ───────────────────────────────────────── */
    .main {
      margin-top: var(--hdr-h);
      padding: 24px;
      transition: margin-right .3s ease;
    }
    .main.panel-open { margin-right: var(--panel-w); }

    /* ── Stat cards ───────────────────────────────────── */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px; margin-bottom: 24px;
    }
    .stat {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      cursor: pointer; transition: all .15s;
    }
    .stat:hover { box-shadow: var(--shadow); border-color: var(--primary); }
    .stat.active { border-color: var(--primary); background: var(--primary-light); }
    .stat-val { font-size: 26px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
    .stat-lbl { font-size: 11px; color: var(--text-2); font-weight: 500; }

    /* ── Toolbar ──────────────────────────────────────── */
    .toolbar {
      display: flex; align-items: center;
      gap: 8px; margin-bottom: 14px; flex-wrap: wrap;
    }
    .search { flex: 1; min-width: 200px; max-width: 340px; position: relative; }
    .search input {
      width: 100%;
      padding: 8px 12px 8px 34px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px; background: var(--surface); color: var(--text); outline: none;
      transition: border-color .15s;
    }
    .search input:focus { border-color: var(--primary); }
    .search-ic {
      position: absolute; left: 10px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-3); font-size: 13px; pointer-events: none;
    }
    .sel {
      padding: 8px 10px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 13px; background: var(--surface); color: var(--text); outline: none;
      cursor: pointer;
    }
    .sel:focus { border-color: var(--primary); }
    .tb-space { flex: 1; }
    .count-lbl { font-size: 12px; color: var(--text-3); }

    /* ── Buttons ──────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 8px 14px; border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 500;
      cursor: pointer; border: none;
      transition: all .15s; white-space: nowrap; font-family: inherit;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-ghost {
      background: transparent; color: var(--text-2);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--surface-2); border-color: var(--border-dark); }
    .btn-danger { background: #FEF2F2; color: #EF4444; border: 1px solid #FECACA; }
    .btn-danger:hover { background: #FEE2E2; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-icon {
      width: 32px; height: 32px; padding: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-sm); font-size: 15px;
    }

    /* ── Table ────────────────────────────────────────── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden; box-shadow: var(--shadow-sm);
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      padding: 10px 14px; text-align: left;
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em;
      color: var(--text-2); background: var(--surface-2);
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    thead th.sort { cursor: pointer; user-select: none; }
    thead th.sort:hover { color: var(--primary); }
    tbody tr {
      border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background .1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--primary-light); }
    tbody tr.sel-row { background: var(--primary-light); border-left: 3px solid var(--primary); }
    tbody td { padding: 12px 14px; vertical-align: middle; }
    .c-name { font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .c-code { font-size: 11px; color: var(--text-3); font-family: monospace; }

    /* ── Badges ───────────────────────────────────────── */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 8px; border-radius: 20px;
      font-size: 11px; font-weight: 600; white-space: nowrap;
    }
    .badge .dot { width: 6px; height: 6px; border-radius: 50%; }
    .b-entregado     { color: var(--c-entregado);     background: #EEF2FF; }
    .b-en_revision   { color: var(--c-en_revision);   background: #F5F3FF; }
    .b-incidencia    { color: var(--c-incidencia);    background: #FEF2F2; }
    .b-en_correccion { color: var(--c-en_correccion); background: #FFF7ED; }
    .b-aprobado      { color: var(--c-aprobado);      background: #F0FDF4; }
    .b-publicado     { color: var(--c-publicado);     background: #F0FDFA; }
    .b-en_pausa      { color: var(--c-en_pausa);      background: #F1F5F9; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .b-incidencia .dot { animation: pulse 1.5s infinite; }

    .vtag {
      display: inline-block;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 4px; padding: 1px 6px;
      font-size: 11px; font-family: monospace; color: var(--text-2);
    }
    .inc-count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 20px; height: 20px; padding: 0 5px;
      background: #FEF2F2; color: #EF4444;
      border-radius: 10px; font-size: 11px; font-weight: 700;
    }
    .days { font-size: 12px; color: var(--text-3); }
    .days.warn  { color: #F97316; }
    .days.alert { color: #EF4444; }

    /* ── Empty state ──────────────────────────────────── */
    .empty { padding: 60px 24px; text-align: center; color: var(--text-2); }
    .empty-ic { font-size: 44px; margin-bottom: 10px; }
    .empty h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: var(--text); }
    .empty p  { font-size: 13px; }

    /* ── Detail panel ─────────────────────────────────── */
    .panel {
      position: fixed; top: var(--hdr-h); right: 0;
      width: var(--panel-w); height: calc(100vh - var(--hdr-h));
      background: var(--surface); border-left: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform .3s ease;
      z-index: 90;
    }
    .panel.open { transform: translateX(0); }
    .panel-hdr { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); }
    .panel-hdr-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .panel-close {
      margin-left: auto; flex-shrink: 0;
      width: 28px; height: 28px; border: none;
      background: var(--surface-2); border-radius: var(--radius-sm);
      cursor: pointer; font-size: 14px; color: var(--text-2);
      display: flex; align-items: center; justify-content: center;
    }
    .panel-close:hover { background: var(--border); }
    .p-title { font-size: 15px; font-weight: 700; line-height: 1.3; }
    .p-sub   { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .p-meta  { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

    .panel-tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 20px; }
    .tab-btn {
      padding: 9px 12px; border: none; background: none;
      font-size: 13px; font-weight: 500; color: var(--text-2);
      cursor: pointer; border-bottom: 2px solid transparent;
      margin-bottom: -1px; transition: all .15s;
      display: flex; align-items: center; gap: 4px; font-family: inherit;
    }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tc   { background: #FEF2F2; color: #EF4444; border-radius: 10px; padding: 1px 5px; font-size: 10px; font-weight: 700; }
    .tc.g { background: #F0FDF4; color: #22C55E; }

    .panel-body { flex: 1; overflow-y: auto; padding: 18px 20px; }
    .panel-foot {
      padding: 12px 20px; border-top: 1px solid var(--border);
      display: flex; gap: 6px; flex-wrap: wrap;
      background: var(--surface-2);
    }

    /* ── Info grid ────────────────────────────────────── */
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .info-item label {
      display: block; font-size: 10px; font-weight: 700;
      color: var(--text-3); text-transform: uppercase;
      letter-spacing: .06em; margin-bottom: 3px;
    }
    .info-item .val { font-size: 13px; color: var(--text); font-weight: 500; }

    /* ── Timeline ─────────────────────────────────────── */
    .timeline { position: relative; padding-left: 22px; }
    .timeline::before {
      content: ''; position: absolute;
      left: 6px; top: 8px; bottom: 8px;
      width: 2px; background: var(--border);
    }
    .tl-item { position: relative; margin-bottom: 18px; }
    .tl-dot {
      position: absolute; left: -18px; top: 5px;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--primary);
      border: 2px solid var(--surface);
      box-shadow: 0 0 0 2px var(--primary);
    }
    .tl-dot.s-entregado     { background:var(--c-entregado);     box-shadow:0 0 0 2px var(--c-entregado); }
    .tl-dot.s-en_revision   { background:var(--c-en_revision);   box-shadow:0 0 0 2px var(--c-en_revision); }
    .tl-dot.s-incidencia    { background:var(--c-incidencia);    box-shadow:0 0 0 2px var(--c-incidencia); }
    .tl-dot.s-en_correccion { background:var(--c-en_correccion); box-shadow:0 0 0 2px var(--c-en_correccion); }
    .tl-dot.s-aprobado      { background:var(--c-aprobado);      box-shadow:0 0 0 2px var(--c-aprobado); }
    .tl-dot.s-publicado     { background:var(--c-publicado);     box-shadow:0 0 0 2px var(--c-publicado); }
    .tl-dot.s-en_pausa      { background:var(--c-en_pausa);      box-shadow:0 0 0 2px var(--c-en_pausa); }
    .tl-date  { font-size: 11px; color: var(--text-3); margin-bottom: 2px; }
    .tl-title { font-weight: 600; font-size: 13px; color: var(--text); margin-bottom: 3px; }
    .tl-note  { font-size: 12px; color: var(--text-2); }

    /* ── Incidents ────────────────────────────────────── */
    .inc-card {
      background: var(--surface-2); border: 1px solid var(--border);
      border-left: 3px solid #EF4444;
      border-radius: var(--radius-sm); padding: 12px; margin-bottom: 10px;
    }
    .inc-card.resolved { border-left-color: #22C55E; opacity: .65; }
    .inc-hdr { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
    .inc-cat {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; padding: 2px 6px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text-2);
    }
    .sev { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
    .sev-alta  { background:#FEF2F2; color:#EF4444; }
    .sev-media { background:#FFF7ED; color:#F97316; }
    .sev-baja  { background:#FEFCE8; color:#CA8A04; }
    .inc-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .inc-desc  { font-size: 12px; color: var(--text-2); line-height: 1.55; }
    .inc-foot  { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 11px; color: var(--text-3); }
    .resolve-btn {
      margin-left: auto; font-size: 11px; color: #22C55E;
      background: none; border: none; cursor: pointer;
      font-weight: 700; font-family: inherit;
    }
    .resolve-btn:hover { text-decoration: underline; }
    .inc-actions {
      display: flex; align-items: center; gap: 8px;
      margin-top: 10px; padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .edit-inc-btn {
      font-size: 11px; font-weight: 600; font-family: inherit;
      color: var(--text-2); background: none;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 2px 8px; cursor: pointer; white-space: nowrap;
      transition: all .15s;
    }
    .edit-inc-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

    /* ── Section title ────────────────────────────────── */
    .sec-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: var(--text-3);
      margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
    }
    .sec-title::after { content:''; flex:1; height:1px; background:var(--border); }
    .no-items { text-align:center; padding:32px; color:var(--text-3); font-size:13px; }

    /* ── Modal ────────────────────────────────────────── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(15,23,42,.45);
      backdrop-filter: blur(3px);
      z-index: 200;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%; max-width: 520px;
      max-height: 88vh; overflow-y: auto;
      transform: translateY(16px);
      transition: transform .2s;
    }
    .overlay.open .modal { transform: translateY(0); }
    .modal-hdr {
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .modal-title { font-size: 15px; font-weight: 700; }
    .modal-close {
      margin-left: auto; width: 28px; height: 28px;
      border: none; background: var(--surface-2);
      border-radius: var(--radius-sm); cursor: pointer;
      font-size: 14px; color: var(--text-2); font-family: inherit;
    }
    .modal-body { padding: 18px 22px; }
    .modal-foot {
      padding: 12px 22px;
      border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; gap: 8px;
      background: var(--surface-2);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    }

    /* ── Forms ────────────────────────────────────────── */
    .fg { margin-bottom: 14px; }
    .fg label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--text); margin-bottom: 5px;
    }
    .fg .hint { font-size: 11px; color: var(--text-3); margin-top: 4px; line-height: 1.5; }
    .fg input, .fg select, .fg textarea {
      width: 100%; padding: 9px 11px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 13px; font-family: inherit; color: var(--text);
      background: var(--surface); outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .fg input:focus, .fg select:focus, .fg textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59,130,246,.1);
    }
    .fg textarea { resize: vertical; min-height: 72px; }
    .f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Settings-specific */
    .gas-status-box {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); margin-bottom: 14px;
      font-size: 13px;
    }
    .gas-status-box.ok   { border-color: #BBF7D0; background: #F0FDF4; color: #15803D; }
    .gas-status-box.err  { border-color: #FECACA; background: #FEF2F2; color: #DC2626; }
    .gas-status-box.info { border-color: var(--border); background: var(--surface-2); color: var(--text-2); }

    .input-row { display: flex; gap: 8px; }
    .input-row input { flex: 1; }

    /* Status options */
    .status-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .status-opt {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 11px; border: 2px solid var(--border);
      border-radius: var(--radius-sm); cursor: pointer;
      transition: all .15s; font-size: 13px; font-weight: 500;
      background: none; font-family: inherit; color: var(--text); text-align: left;
    }
    .status-opt:hover { border-color: var(--primary); }
    .status-opt.sel  { border-color: var(--primary); background: var(--primary-light); }
    .status-opt .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* ── Toast ────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text); color: #fff;
      padding: 10px 20px; border-radius: 24px;
      font-size: 13px; font-weight: 500;
      box-shadow: var(--shadow-lg); z-index: 999;
      transition: transform .3s ease; pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ── Scrollbar ────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-dark); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

    /* ── Tarjetas móvil (renderizadas por JS) ─────────── */
    .m-card { border-bottom: none !important; cursor: pointer; }
    .m-card-cell {
      display: block;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      box-shadow: var(--shadow-sm);
      transition: border-color .15s, box-shadow .15s;
    }
    .m-card:hover .m-card-cell { border-color: var(--primary); box-shadow: var(--shadow); }
    .m-card.sel-row .m-card-cell {
      border-color: var(--primary);
      background: var(--primary-light);
      border-left: 3px solid var(--primary);
    }
    .m-card-top {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 10px;
      margin-bottom: 8px;
    }
    .m-card-info { min-width: 0; flex: 1; }
    .m-card-bot {
      display: flex; align-items: center; gap: 8px;
    }
    .m-card-bot .days { margin-left: auto; }

    /* ── Responsive ───────────────────────────────────── */
    @media (max-width: 900px) {
      .hdr-sub { display: none; }
      .hdr-div { display: none; }
    }
    @media (max-width: 768px) {
      :root { --panel-w: 100vw; }
      .main.panel-open { margin-right: 0; }
      .panel { top: 0; height: 100vh; }
      .stats { grid-template-columns: repeat(3,1fr); }
      .info-grid { grid-template-columns: 1fr; }
      .f2 { grid-template-columns: 1fr; }
      .col-prov, .col-ver, .col-days, .col-by { display: none; }
      .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    }

    /* ── Móvil ≤ 768px (complementa el bloque ya existente) ── */
    @media (max-width: 768px) {
      /* Cabecera: botones compactos, ocultar etiquetas de texto */
      .hdr { padding: 0 12px; gap: 6px; }
      .hdr-logo { font-size: 15px; }
      .hdr-logo .icon { width: 28px; height: 28px; font-size: 13px; }
      .hdr-actions { gap: 4px; }
      .btn-lbl { display: none; }
      .conn-pill { font-size: 11px; padding: 3px 9px; }
      .hdr-actions .btn-ghost { width: 36px; height: 36px; padding: 0; justify-content: center; font-size: 14px; }
      .hdr-actions .btn-icon  { width: 36px; height: 36px; }
      .hdr-actions .btn-primary { padding: 0 12px; height: 36px; font-size: 13px; }
      /* Tabla: el JS renderiza tarjetas */
      thead { display: none !important; }
      .table-wrap { background: transparent; border: none; box-shadow: none; overflow: visible; padding: 0; }
      table { display: block; width: 100%; }
      tbody { display: flex !important; flex-direction: column; gap: 8px; }
    }

    /* ── Teléfonos pequeños ≤ 600px ───────────────────────── */
    @media (max-width: 600px) {
      :root { --hdr-h: 52px; }
      body { font-size: 13px; }

      /* Espaciado principal */
      .main { padding: 12px 10px; }

      /* Estadísticas: 3 columnas compactas */
      .stats { grid-template-columns: repeat(3,1fr); gap: 6px; margin-bottom: 14px; }
      .stat { padding: 10px 6px; }
      .stat-val { font-size: 20px; }
      .stat-lbl { font-size: 9px; }

      /* Toolbar apilada */
      .toolbar { flex-direction: column; align-items: stretch; gap: 6px; margin-bottom: 10px; }
      .search { min-width: 100%; max-width: 100%; }
      .sel { width: 100%; }
      .tb-space { display: none; }
      .count-lbl { font-size: 11px; text-align: right; }

      /* 16px en inputs previene zoom automático en iOS */
      .search input, .sel,
      .fg input, .fg select, .fg textarea { font-size: 16px; }
      .search input, .sel { min-height: 40px; }

      /* Áreas táctiles */
      .btn { touch-action: manipulation; }
      .stat { touch-action: manipulation; }

      /* Tabla: el JS renderiza tarjetas en móvil */
      thead { display: none; }
      .table-wrap { background: transparent; border: none; box-shadow: none; overflow: visible; padding: 0; }
      table { display: block; width: 100%; }
      tbody { display: flex; flex-direction: column; gap: 8px; }

      /* Panel lateral */
      .panel { padding-top: env(safe-area-inset-top, 0px); }
      .panel-hdr { padding: 14px 14px 12px; }
      .panel-body { padding: 14px; }
      .panel-foot { padding: 10px 12px; gap: 4px; flex-wrap: wrap; }
      .panel-foot .btn-sm { font-size: 11px; padding: 7px 8px; }
      .tab-btn { padding: 8px 8px; font-size: 12px; }

      /* Modal */
      .overlay { padding: 10px; }
      .modal { border-radius: var(--radius); max-height: 92vh; }
      .modal-hdr { padding: 14px 16px 12px; }
      .modal-body { padding: 14px 16px; }
      .modal-foot { padding: 10px 16px; }
      .status-opts { grid-template-columns: 1fr 1fr; }

      /* Toast con safe-area iOS */
      #toast { bottom: max(16px, env(safe-area-inset-bottom, 16px)); white-space: normal; text-align: center; max-width: 90vw; }
    }

    /* ── Teléfonos pequeños ≤ 400px ───────────────────────── */
    @media (max-width: 400px) {
      .stats { grid-template-columns: repeat(2,1fr); }
      .panel-foot { flex-direction: column; }
      .panel-foot .btn-sm { width: 100%; justify-content: center; }
      .panel-foot .btn-danger { width: auto; align-self: flex-end; }
    }

    /* ── Login modal ─────────────────────────────────── */
    .login-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(15,23,42,.75); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
    }
    .login-overlay.hidden { display: none; }
    .login-box {
      background: var(--surface); border-radius: var(--radius-lg);
      padding: 36px 28px 28px; width: min(380px, 92vw);
      box-shadow: var(--shadow-lg); text-align: center;
    }
    .login-box h2 { font-size: 20px; font-weight: 700; margin: 10px 0 6px; }
    .login-box p  { font-size: 13px; color: var(--text-2); margin-bottom: 20px; }
    .user-grid { display: flex; flex-direction: column; gap: 8px; text-align: left; }
    .user-btn {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border); background: var(--surface);
      cursor: pointer; font-size: 14px; font-weight: 500;
      color: var(--text); transition: all .15s; width: 100%;
      font-family: inherit;
    }
    .user-btn:hover { border-color: var(--primary); background: var(--primary-light); color: var(--primary-dark); }
    .u-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; flex-shrink: 0;
    }

    /* ── User chip en cabecera ───────────────────────── */
    .user-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 20px;
      background: var(--primary-light); border: 1.5px solid var(--primary);

    @media (max-width: 768px) { .user-chip .btn-lbl { display: none; } }

    * { -webkit-tap-highlight-color: transparent; }
  </style>
</head>

<script>
// ══════════════════════════════════════════════════════════════════
//  CONSTANTS
// ══════════════════════════════════════════════════════════════════

const STATUS = {
  entregado:     { label:'Entregado',      emoji:'📥', color:'#6366F1' },
  en_revision:   { label:'En revisión',    emoji:'🔍', color:'#8B5CF6' },
  incidencia:    { label:'Incidencia',     emoji:'⚡', color:'#EF4444' },
  en_correccion: { label:'En corrección',  emoji:'🔧', color:'#F97316' },
  aprobado:      { label:'Aprobado',       emoji:'✅', color:'#22C55E' },
  publicado:     { label:'Publicado',      emoji:'🚀', color:'#0D9488' },
  en_pausa:      { label:'En pausa',       emoji:'⏸', color:'#94A3B8' },
};
const INC_CATS = [
  'SCORM / xAPI','Contenido','Diseño / UX','Técnico',
  'Estructura IMS','Evaluación','Vídeo / Audio','Accesibilidad','Otro'
];
const SEVS     = ['Alta','Media','Baja'];
const LS_KEY    = 'coursetrack_v1';
const GAS_KEY   = 'coursetrack_gas_url';
const USER_KEY  = 'coursetrack_user';
const THEME_KEY = 'coursetrack_theme';

// ── Editar estas listas para añadir/quitar valores ────────────────
const USERS = [
  'Paco',
  'Lourdes',
  'Natalia',
];

const PROVIDERS = [
  'Accenture',
  'INAP',
  'Mercadona',
  'Test Provider',
];

const LANGUAGES = [
  'Español',
  'Inglés',
  'Catalán',
  'Euskera',
  'Gallego',
];

// ══════════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════════

let courses   = loadLocal();  // carga inmediata desde localStorage
let gasUrl    = (localStorage.getItem(GAS_KEY) || '').trim();
let syncing   = false;
let selId     = null;
let curTab    = 'info';
let sortField = 'updatedAt';
let sortDir   = -1;
let confirmFn  = null;
let activeUser = localStorage.getItem(USER_KEY) || '';

// ══════════════════════════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════════════════════════

function uid()  { return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function today(){ return new Date().toISOString().slice(0,10); }
function daysSince(d){ return Math.floor((Date.now()-new Date(d))/86400000); }
function fmt(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
}
function badge(status) {
  const s = STATUS[status]||{label:status,color:'#94A3B8'};
  return `<span class="badge b-${status}"><span class="dot" style="background:${s.color}"></span>${s.label}</span>`;
}
function toast(msg, ms=2600) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(()=>t.classList.remove('show'), ms);
}
function nextMinor(ver){ const p=ver.split('.'); p[1]=String(parseInt(p[1]||0)+1); return p.join('.'); }
function nextMajor(ver){ const p=ver.split('.'); p[0]=String(parseInt(p[0])+1); p[1]='0'; return p.join('.'); }
function getCourse(id) { return courses.find(c=>c.id===id); }
function curVer(c)     { return c.versions[c.versions.length-1]; }
function openInc(c)    { return c.versions.flatMap(v=>v.incidents||[]).filter(i=>!i.resolved); }
function allInc(c)     { return c.versions.flatMap(v=>(v.incidents||[]).map(i=>({...i,_ver:v.number}))); }

// ══════════════════════════════════════════════════════════════════
//  STORAGE — localStorage
// ══════════════════════════════════════════════════════════════════

function loadLocal() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || seed(); }
  catch(e) { return seed(); }
}
function saveLocal(data) {
  localStorage.setItem(LS_KEY, JSON.stringify(data));
}

// ══════════════════════════════════════════════════════════════════
//  STORAGE — Google Apps Script
// ══════════════════════════════════════════════════════════════════

function updateConnPill(state) {
  const pill = document.getElementById('connPill');
  if (!pill) return;
  const states = {
    local:    { cls:'local',     text:'⚫ Local'             },
    syncing:  { cls:'syncing',   text:'<span class="spin">⟳</span> Sincronizando…' },
    ok:       { cls:'connected', text:'🟢 Google Sheets'     },
    error:    { cls:'error',     text:'🔴 Sin conexión'      },
  };
  const s = states[state] || states.local;
  pill.className = `conn-pill ${s.cls}`;
  pill.innerHTML = s.text;
}

// Carga desde GAS (GET). Devuelve array o null si falla.
async function loadFromGAS() {
  if (!gasUrl) return null;
  try {
    const res = await fetch(gasUrl + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    return Array.isArray(data) ? data : null;
  } catch(e) {
    return null;
  }
}

// Guarda en GAS (POST no-cors = fire-and-forget, evita preflight).
async function saveToGAS(data) {
  if (!gasUrl) return;
  syncing = true;
  updateConnPill('syncing');
  try {
    await fetch(gasUrl, {
      method: 'POST',
      mode:   'no-cors',   // evita preflight CORS desde file://
      body:   JSON.stringify(data)
    });
    updateConnPill('ok');
    toast('☁ Guardado en Google Sheets');
  } catch(e) {
    updateConnPill('error');
    toast('⚠ Error al guardar en Google Sheets. Datos en localStorage.');
  } finally {
    syncing = false;
  }
}

// Punto de entrada unificado: guarda siempre en local y opcionalmente en GAS.
function save() {
  saveLocal(courses);
  if (gasUrl) saveToGAS(courses);
}

// ── Tema oscuro ───────────────────────────────────────────────────────────
function initTheme() {
  const saved = localStorage.getItem(THEME_KEY) || 'light';
  applyTheme(saved);
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem(THEME_KEY, theme);
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = theme === 'dark' ? '☀' : '🌙';
}

// Inicialización: muestra datos locales enseguida, luego intenta GAS.
async function init() {
  initTheme();
  render(); // muestra local inmediatamente
  if (!gasUrl) { updateConnPill('local'); return; }

  updateConnPill('syncing');
  const remote = await loadFromGAS();
  if (remote) {
    courses = remote;
    saveLocal(courses);
    render();
    updateConnPill('ok');
    toast('☁ Datos cargados desde Google Sheets');
  } else {
    updateConnPill('error');
    toast('⚠ No se pudo conectar con Google Sheets. Usando datos locales.');
  }
}

// Test de conexión: abre la URL en nueva pestaña (evita el bloqueo CORS de file://).
// Si se sirve desde localhost, también intenta fetch directo.
async function testConnection(url) {
  url = (url||'').trim();
  const box = document.getElementById('gasStatusBox');
  if (!url) {
    box.className = 'gas-status-box err';
    box.innerHTML = '❌ Introduce una URL antes de probar.';
    return;
  }

  // Si estamos en localhost, fetch funciona con CORS normal.
  if (location.protocol !== 'file:') {
    box.className = 'gas-status-box info';
    box.textContent = '⏳ Probando conexión…';
    try {
      const res = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const n = Array.isArray(data) ? data.length : '?';
      box.className = 'gas-status-box ok';
      box.innerHTML = `✅ Conexión correcta — ${n} curso(s) en Google Sheets`;
    } catch(e) {
      box.className = 'gas-status-box err';
      box.innerHTML = `❌ Error: ${e.message}. Revisa la URL y el despliegue.`;
    }
    return;
  }

  // Desde file:// Chrome bloquea fetch externo. Abrimos en pestaña nueva.
  box.className = 'gas-status-box info';
  box.innerHTML = `⚠ <strong>Abierto en pestaña nueva.</strong> Si ves un JSON con <code>[]</code> o datos de cursos, la conexión es correcta.
    <br><br>Para que el test y la sincronización funcionen sin esta limitación, <strong>sirve el HTML desde localhost</strong>:
    <br><code style="font-size:11px;background:#E2E8F0;padding:2px 5px;border-radius:3px">python -m http.server 8080</code>

function render() { renderStats(); renderFilters(); renderTable(); }

function renderStats() {
  const bar = document.getElementById('statsBar');
  const cnt = { _total: courses.length };
  Object.keys(STATUS).forEach(k=>cnt[k]=0);
  courses.forEach(c=>{ const s=curVer(c)?.status; if(s) cnt[s]=(cnt[s]||0)+1; });
  const items = [
    { key:'',             label:'Total',        val:cnt._total,        color:'var(--primary)' },
    { key:'en_revision',  label:'En revisión',  val:cnt.en_revision,   color:'#8B5CF6'        },
    { key:'incidencia',   label:'Incidencias',  val:cnt.incidencia,    color:'#EF4444'        },
    { key:'en_correccion',label:'En corrección',val:cnt.en_correccion, color:'#F97316'        },
    { key:'aprobado',     label:'Aprobados',    val:cnt.aprobado,      color:'#22C55E'        },
    { key:'publicado',    label:'Publicados',   val:cnt.publicado,     color:'#0D9488'        },
  ];
  const active = document.getElementById('fStat').value;
  bar.innerHTML = items.map(i=>`
    <div class="stat ${active===i.key?'active':''}" onclick="filterStat('${i.key}')">
      <div class="stat-val" style="color:${i.color}">${i.val}</div>
      <div class="stat-lbl">${i.label}</div>
    </div>`).join('');
}

function filterStat(key) { document.getElementById('fStat').value=key; render(); }

function renderFilters() {
  // Proveedores: lista fija + cualquier proveedor extra que venga de los datos
  const provSel = document.getElementById('fProv');
  const curProv = provSel.value;
  const extraProvs = courses.map(c=>c.provider).filter(p=>p&&!PROVIDERS.includes(p));
  const allProvs = [...PROVIDERS, ...[...new Set(extraProvs)].sort()];
  provSel.innerHTML = '<option value="">Todos los proveedores</option>' +
    allProvs.map(p=>`<option value="${p}"${p===curProv?' selected':''}>${p}</option>`).join('');

  // Usuarios (desde modificadoPor de todas las versiones)
  const userSel = document.getElementById('fUser');
  const curU    = userSel.value;
  const users   = [...new Set(
    courses.flatMap(c=>c.versions.map(v=>v.modificadoPor||'').filter(Boolean))
  )].sort();
  userSel.innerHTML = '<option value="">Todos los usuarios</option>' +
    users.map(u=>`<option value="${u}"${u===curU?' selected':''}>${u}</option>`).join('');
}

// ── Funciones de usuario ──────────────────────────────────────────
function currentUser() { return activeUser; }

function updateUserChip() {
  const el = document.getElementById('userChip');
  if (!el) return;
  const first = activeUser ? activeUser.split(' ')[0] : '—';
  el.innerHTML = `👤 <span class="btn-lbl">${first}</span>`;
  el.title = activeUser
    ? `Conectado como ${activeUser} — clic para cambiar`
    : 'Seleccionar usuario';
}

function showLoginModal() {
  const ol = document.getElementById('loginOverlay');
  const ul = document.getElementById('userList');
  ul.innerHTML = USERS.map((u,i)=>`
    <button class="user-btn" onclick="pickUser(${i})">
      <div class="u-avatar">${u.charAt(0).toUpperCase()}</div>
      ${u}
    </button>`).join('');
  ol.classList.remove('hidden');
}

function pickUser(idx) {
  const name = typeof idx === 'number' ? USERS[idx] : idx;
  activeUser = name;
  localStorage.setItem(USER_KEY, name);
  document.getElementById('loginOverlay').classList.add('hidden');
  updateUserChip();
  toast(`Bienvenid@ ${name.split(' ')[0]} 👋`);
}

function changeUser() { /* bloqueado — el usuario no puede cambiarse una vez elegido */ }

function getFiltered() {
  const q    = document.getElementById('q').value.toLowerCase();
  const stat = document.getElementById('fStat').value;
  const prov = document.getElementById('fProv').value;
  const user = document.getElementById('fUser').value;
  return courses.filter(c=>{
    const s = curVer(c)?.status;
    if (stat && s!==stat) return false;
    if (prov && c.provider!==prov) return false;
    if (user && curVer(c)?.modificadoPor!==user) return false;
    if (q && !`${c.name} ${c.code} ${c.provider}`.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>{
    const av = a[sortField]??curVer(a)?.[sortField]??'';
    const bv = b[sortField]??curVer(b)?.[sortField]??'';
    return av<bv?-sortDir:av>bv?sortDir:0;
  });
}

function renderTable() {
  const list  = getFiltered();
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('emptyState');
  const mobile = window.innerWidth < 768;

  document.getElementById('countLbl').textContent =
    list.length===courses.length
      ? `${courses.length} curso${courses.length!==1?'s':''}`
      : `${list.length} de ${courses.length}`;

  if (!list.length) { tbody.innerHTML=''; empty.style.display=''; return; }
  empty.style.display = 'none';

  if (mobile) {
    tbody.innerHTML = list.map(c=>{
      const cv   = curVer(c);
      const stat = cv?.status||'entregado';
      const oi   = openInc(c).length;
      const days = cv?daysSince(cv.date):0;
      const dc   = days>14?'alert':days>7?'warn':'';
      return `<tr class="m-card ${c.id===selId?'sel-row':''}" onclick="selectCourse('${c.id}')">
        <td class="m-card-cell" colspan="7">
          <div class="m-card-top">
            <div class="m-card-info">
              <div class="c-name">${c.name}</div>
              <div class="c-code">${c.code} · ${c.provider}</div>
            </div>
            ${oi?`<span class="inc-count">${oi}</span>`:''}
          </div>
          <div class="m-card-bot">
            ${badge(stat)}
            ${cv?.modificadoPor?`<span style="font-size:11px;color:var(--text-3)">👤${cv.modificadoPor.split(' ')[0]}</span>`:''}
            <span class="days ${dc}">${days}d</span>
          </div>
        </td>
      </tr>`;
    }).join('');
  } else {
    tbody.innerHTML = list.map(c=>{
      const cv   = curVer(c);
      const stat = cv?.status||'entregado';
      const oi   = openInc(c).length;
      const days = cv?daysSince(cv.date):0;
      const dc   = days>14?'alert':days>7?'warn':'';
      return `<tr class="${c.id===selId?'sel-row':''}" onclick="selectCourse('${c.id}')">
        <td><div class="c-name">${c.name}</div><div class="c-code">${c.code}</div></td>
        <td class="col-prov">${c.provider}</td>
        <td class="col-ver"><span class="vtag">v${cv?.number||'—'}</span></td>
        <td>${badge(stat)}</td>
        <td class="col-inc">${oi?`<span class="inc-count">${oi}</span>`:'<span style="color:var(--text-3);font-size:12px">—</span>'}</td>
        <td class="col-days"><span class="days ${dc}">${days}d</span></td>
        <td class="col-by" style="font-size:12px;color:var(--text-2)">${cv?.modificadoPor||'—'}</td>
        <td class="col-updated" style="font-size:12px;color:var(--text-2)">${fmt(c.updatedAt)}</td>
      </tr>`;
    }).join('');
  }
}

function sortBy(f) { sortDir=sortField===f?-sortDir:1; sortField=f; renderTable(); }

function selectCourse(id) {
  selId = id;
  document.getElementById('panel').classList.add('open');
  document.getElementById('main').classList.add('panel-open');
  renderPanel(); renderTable();
}
function closePanel() {
  selId = null;
  document.getElementById('panel').classList.remove('open');
  document.getElementById('main').classList.remove('panel-open');
  renderTable();
}
function renderPanel() {
  const c = getCourse(selId); if(!c) return;
  const cv = curVer(c);
  document.getElementById('pTitle').textContent = c.name;
  document.getElementById('pSub').textContent   = `${c.code} · ${c.provider}`;
  document.getElementById('pMeta').innerHTML    = badge(cv?.status||'entregado')+`<span class="vtag">v${cv?.number||'—'}</span>`;
  const oi=openInc(c).length, ai=allInc(c).length;
  document.getElementById('vCnt').textContent = c.versions.length;
  const iSpan=document.getElementById('iCnt');
  iSpan.textContent=oi||ai; iSpan.style.display=ai?'':'none';
  iSpan.className = oi?'tc':'tc g';
  renderTab();
}
function switchTab(tab) {
  curTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  renderTab();
}
function renderTab() {
  const c=getCourse(selId); if(!c) return;
  const el=document.getElementById('panelBody');
  if (curTab==='info') {
    el.innerHTML=`
      <div class="sec-title">Datos del curso</div>
      <div class="info-grid">
        <div class="info-item"><label>Proveedor</label>     <div class="val">${c.provider}</div></div>
        <div class="info-item"><label>Estándar</label>      <div class="val">${c.scormVersion||'—'}</div></div>
        <div class="info-item"><label>Idioma</label>        <div class="val">${c.language||'—'}</div></div>
        <div class="info-item"><label>Duración</label>      <div class="val">${c.duration||'—'}</div></div>
        <div class="info-item"><label>Alta</label>          <div class="val">${fmt(c.createdAt)}</div></div>
        <div class="info-item"><label>Actualización</label> <div class="val">${fmt(c.updatedAt)}</div></div>
      </div>
      ${c.notes?`<div class="sec-title">Notas</div><p style="font-size:13px;color:var(--text-2);line-height:1.65">${c.notes}</p>`:''}`;
  } else if (curTab==='versions') {
    const items=[...c.versions].reverse();
    el.innerHTML=`
      <div class="sec-title">Historial (${c.versions.length})</div>
      <div class="timeline">
        ${items.map(v=>`
          <div class="tl-item">
            <div class="tl-dot s-${v.status}"></div>
            <div class="tl-date">${fmt(v.date)}</div>
            <div class="tl-title"><span class="vtag">v${v.number}</span>&nbsp;${badge(v.status)}</div>
            ${v.notes?`<div class="tl-note">${v.notes}</div>`:''}
            ${v.modificadoPor?`<div style="margin-top:4px;font-size:11px;color:var(--text-3)">👤 ${v.modificadoPor}</div>`:''}
            ${(v.incidents||[]).length?`<div style="margin-top:4px;font-size:11px;color:#EF4444">⚡ ${v.incidents.length} incidencia(s)</div>`:''}
          </div>`).join('')}
      </div>`;
  } else if (curTab==='incidents') {
    const all=allInc(c), open=all.filter(i=>!i.resolved), closed=all.filter(i=>i.resolved);
    const mkCard=i=>`
      <div class="inc-card ${i.resolved?'resolved':''}">
        <div class="inc-hdr">
          <span class="inc-cat">${i.category}</span>
          <span class="sev sev-${(i.severity||'Media').toLowerCase()}">${i.severity}</span>
          <span class="vtag">v${i._ver}</span>
          ${i.resolved?`<span style="margin-left:auto;font-size:11px;color:#22C55E;font-weight:600">✓ Resuelta</span>`:''}
        </div>
        <div class="inc-title">${i.title}</div>
        <div class="inc-desc">${i.description}</div>
        ${i.resolved&&i.resolution?`<div class="inc-foot">📝 ${i.resolution}</div>`:''}
        <div class="inc-foot">📅 ${fmt(i.date)}${i.creadaPor?` · 👤 ${i.creadaPor}`:''}${i.editadoPor?` · ✏ ${i.editadoPor} (${fmt(i.fechaEdicion)})`:''} ${i.resolved&&i.resueltaPor?` · ✓ ${i.resueltaPor}`:''}</div>
        <div class="inc-actions">
          <button class="edit-inc-btn" onclick="openEditIncModal('${i.id}')">✏ Editar incidencia</button>
          ${!i.resolved?`<button class="resolve-btn" style="margin-left:auto" onclick="resolveInc('${i.id}')">Resolver ✓</button>`:''}
        </div>
      </div>`;
    el.innerHTML=
      (open.length  ?`<div class="sec-title">Abiertas (${open.length})</div>${open.map(mkCard).join('')}`:'') +
      (closed.length?`<div class="sec-title" style="margin-top:12px">Resueltas (${closed.length})</div>${closed.map(mkCard).join('')}`:'') +
      (!all.length  ?'<div class="no-items">Sin incidencias registradas ✓</div>':'');
  }
}
function resolveInc(iid) {
  const c=getCourse(selId);
  const res=prompt('Resolución (opcional):')??' ';
  c.versions.forEach(v=>{ const i=(v.incidents||[]).find(x=>x.id===iid); if(i){i.resolved=true;i.resolution=res;i.resueltaPor=activeUser;} });
  c.updatedAt=today();
  save(); renderPanel(); renderTable();
  toast('Incidencia marcada como resuelta ✓');
}
function openEditIncModal(iid) {
  const c = getCourse(selId);
  let inc = null;
  c.versions.forEach(v => { const f=(v.incidents||[]).find(x=>x.id===iid); if(f) inc=f; });
  if (!inc) return;

  document.getElementById('overlay').classList.add('open');
  document.getElementById('mConfirm').style.cssText = '';
  document.getElementById('mFoot').style.display    = '';
  document.getElementById('mIcon').textContent      = '✏';
  document.getElementById('mTitle').textContent     = 'Editar incidencia';
  document.getElementById('mConfirm').textContent   = 'Guardar cambios';
  document.getElementById('mBody').innerHTML = `
    <div class="f2">
      <div class="fg"><label>Categoría *</label>
        <select id="f_icat">${INC_CATS.map(x=>`<option${x===inc.category?' selected':''}>${x}</option>`).join('')}</select></div>
      <div class="fg"><label>Severidad *</label>
        <select id="f_isev">${SEVS.map(x=>`<option${x===inc.severity?' selected':''}>${x}</option>`).join('')}</select></div>
    </div>
    <div class="fg"><label>Título *</label>
      <input id="f_itit" type="text" value="${inc.title.replace(/"/g,'&quot;')}"></div>
    <div class="fg"><label>Descripción detallada *</label>
      <textarea id="f_idesc" style="min-height:96px">${inc.description}</textarea></div>
    <div class="f2">
      <div class="fg"><label>Fecha de detección</label>
        <input id="f_idate" type="date" value="${inc.date}"></div>
      <div class="fg"><label>Estado</label>
        <select id="f_iresolved" onchange="toggleResolutionField()">
          <option value="0"${!inc.resolved?' selected':''}>Abierta</option>
          <option value="1"${inc.resolved?' selected':''}>Resuelta</option>
        </select></div>
    </div>
    <div class="fg" id="fg_resolution" style="${inc.resolved?'':'display:none'}">
      <label>Texto de resolución</label>
      <textarea id="f_iresolution" style="min-height:60px">${inc.resolution||''}</textarea>
    </div>
    <div class="fg"><label>Creada por</label>
      <input type="text" value="${inc.creadaPor||'—'}" disabled style="background:var(--surface-2);color:var(--text-2)"></div>
    ${inc.editadoPor?`
    <div class="fg"><label>Última edición</label>
      <input type="text" value="✏ ${inc.editadoPor} — ${fmt(inc.fechaEdicion)}" disabled style="background:var(--surface-2);color:var(--text-2)"></div>`:''}
    ${inc.resueltaPor?`
    <div class="fg"><label>Resuelta por</label>
      <input type="text" value="✓ ${inc.resueltaPor}" disabled style="background:var(--surface-2);color:var(--text-2)"></div>`:''}`;
  confirmFn = () => {
    const tit  = document.getElementById('f_itit').value.trim();
    const desc = document.getElementById('f_idesc').value.trim();
    if (!tit||!desc) { toast('Título y descripción son obligatorios'); return false; }
    const nowResolved = document.getElementById('f_iresolved').value === '1';
    inc.category    = document.getElementById('f_icat').value;
    inc.severity    = document.getElementById('f_isev').value;
    inc.title       = tit;
    inc.description = desc;
    inc.date        = document.getElementById('f_idate').value || today();
    inc.resolved    = nowResolved;
    inc.resolution  = nowResolved ? (document.getElementById('f_iresolution').value.trim() || inc.resolution || '') : inc.resolution;
    if (nowResolved && !inc.resueltaPor) inc.resueltaPor = activeUser;
    inc.editadoPor   = activeUser;
    inc.fechaEdicion = today();
    c.updatedAt = today();
    save(); switchTab('incidents'); return true;
  };
}

function toggleResolutionField() {
  const show = document.getElementById('f_iresolved').value === '1';
  document.getElementById('fg_resolution').style.display = show ? '' : 'none';
}

function deleteCourse() {
  const c=getCourse(selId);
  if(!confirm(`¿Eliminar "${c.name}"?\nEsta acción no se puede deshacer.`)) return;
  courses=courses.filter(x=>x.id!==selId);
  save(); closePanel();
  toast('Curso eliminado');
}

const SS    = SpreadsheetApp.getActiveSpreadsheet();
const SHEET = SS.getSheetByName('Data');

function doGet(e) {
  const data = SHEET.getRange('A1').getValue() || '[]';
  return ContentService
    .createTextOutput(data)
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  SHEET.getRange('A1').setValue(e.postData.contents);
  const log = SS.getSheetByName('Log');
  if (log) log.appendRow([new Date(), e.postData.contents.length + ' bytes']);
  return ContentService
    .createTextOutput(JSON.stringify({ ok: true }))
    .setMimeType(ContentService.MimeType.JSON);
}</textarea>
        <div class="hint">Extensiones → Apps Script → pega el código → Implementar → Nueva implementación → Aplicación web → Ejecutar como: <strong>Yo</strong> → Acceso: <strong>Cualquiera</strong>.</div>
      </div>
      ${gasUrl?`<div style="margin-top:8px">
        <button class="btn btn-ghost btn-sm" onclick="syncNow()" style="width:100%;justify-content:center">

        <button class="btn btn-danger btn-sm" onclick="disconnectGAS()" style="width:100%;justify-content:center">

        </button>

    confirmFn = () => {
      const url = document.getElementById('f_gasUrl').value.trim();

      localStorage.setItem(GAS_KEY, gasUrl);

      </div>
      <div class="fg"><label>Notas internas</label>
        <textarea id="f_notes" placeholder="Observaciones para la oficina técnica…"></textarea></div>`;
    confirmFn = () => {
      const name=document.getElementById('f_name').value.trim();
      const code=document.getElementById('f_code').value.trim();
      const prov=document.getElementById('f_prov').value.trim();

      const now=today();

  // ── Editar curso ─────────────────────────────────────
  else if (mode==='editCourse') {
    document.getElementById('mIcon').textContent  = '✏';
    document.getElementById('mTitle').textContent = 'Editar curso';
    document.getElementById('mConfirm').textContent = 'Guardar cambios';

        <textarea id="f_notes">${c.notes||''}</textarea></div>`;
    confirmFn = () => {

      const code = document.getElementById('f_code').value.trim();

  else if (mode==='incident') {

function selStat(el) {
  document.querySelectorAll('.status-opt').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');
}
function doConfirm() {
  if (confirmFn&&confirmFn()) { closeModal(); render(); if(selId) renderPanel(); }
}
function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  confirmFn=null;
}
function overlayClick(e) {
  if (e.target===document.getElementById('overlay')) closeModal();
}

// ── Acciones de configuración GAS ───────────────────────────────
async function syncNow() {
  closeModal();
  toast('⟳ Recargando desde Google Sheets…');
  const remote = await loadFromGAS();
  if (remote) {
    courses=remote; saveLocal(courses); render();
    updateConnPill('ok');
    toast(`☁ ${remote.length} cursos cargados desde Google Sheets`);
  } else {
    updateConnPill('error');
    toast('⚠ No se pudo conectar con Google Sheets.');
  }
}
function disconnectGAS() {
  if (!confirm('¿Desconectar Google Sheets? Los datos se seguirán guardando en este navegador.')) return;
  gasUrl=''; localStorage.removeItem(GAS_KEY);
  updateConnPill('local');
  closeModal();
  toast('Desconectado de Google Sheets. Modo local activado.');
}

// ══════════════════════════════════════════════════════════════════
//  IMPORT / EXPORT
// ══════════════════════════════════════════════════════════════════

function exportJSON() {
  const blob=new Blob([JSON.stringify(courses,null,2)],{type:'application/json'});
  const a=Object.assign(document.createElement('a'),{
    href:URL.createObjectURL(blob),
    download:`coursetrack_${today()}.json`
  });
  a.click(); URL.revokeObjectURL(a.href);
  toast('Datos exportados ✓');
}
function importJSON() { document.getElementById('fileInput').click(); }
function onFileImport(e) {
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try {
      const data=JSON.parse(ev.target.result);
      if (!Array.isArray(data)) throw new Error('Formato no válido');
      if (!confirm(`¿Importar ${data.length} curso(s)? Se reemplazarán los datos actuales.`)) return;
      courses=data; save(); render();
      toast(`${data.length} cursos importados ✓`);
    } catch(err) { toast('Error al importar: '+err.message); }
  };
  reader.readAsText(file);
  e.target.value='';
}

// ══════════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════════

function adjustLayout() {
  const hdr   = document.querySelector('.hdr');
  const main  = document.getElementById('main');
  const panel = document.getElementById('panel');
  if (!hdr || !main) return;
  const h = hdr.offsetHeight;
  main.style.marginTop = h + 'px';
  if (panel) {
    if (window.innerWidth > 768) {
      panel.style.top    = h + 'px';
      panel.style.height = `calc(100vh - ${h}px)`;
    } else {
      panel.style.top    = '';
      panel.style.height = '';
    }
  }
}

let _resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => { adjustLayout(); render(); }, 150);
});

init();
adjustLayout();
updateUserChip();
if (!activeUser) showLoginModal();
</script>
